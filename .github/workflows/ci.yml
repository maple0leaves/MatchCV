name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: java-backend/pom.xml
      - name: Test Java backend
        working-directory: java-backend
        run: mvn --batch-mode verify

  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ci-test-key
      EMBEDDING_BACKEND: hash
      JWT_SECRET: ci-test-jwt-secret-at-least-32-bytes
      INTERNAL_SERVICE_TOKEN: ci-test-internal-token-at-least-32-bytes
      CHECKPOINT_DB_PATH: ${{ runner.temp }}/matchcv/checkpoints.db
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Install dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt
      - name: Run Python tests
        working-directory: ai-service
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate local Compose
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet
      - name: Validate production Compose
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet
